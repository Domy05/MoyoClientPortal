name: Azure PaaS Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: dotnet restore
      - run: dotnet publish --configuration Release --output ./publish --no-restore

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_BACKEND_APP_NAME }}
          package: backend/publish

  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend
      - name: Configure production frontend
        env:
          API_BASE_URL: ${{ vars.AZURE_BACKEND_URL }}
          OIDC_AUTHORITY: ${{ vars.OIDC_AUTHORITY }}
          OIDC_CLIENT_ID: ${{ vars.OIDC_CLIENT_ID }}
          OIDC_SCOPE: ${{ vars.OIDC_SCOPE }}
          OIDC_API_AUDIENCE: ${{ vars.OIDC_API_AUDIENCE }}
        run: |
          test -n "$API_BASE_URL"
          cat > src/environments/environment.production.ts <<EOF
          export const environment = {
            production: true,
            apiBaseUrl: '${API_BASE_URL%/}/api',
            oidc: {
              authority: '$OIDC_AUTHORITY',
              clientId: '$OIDC_CLIENT_ID',
              scope: '${OIDC_SCOPE:-openid profile email}',
              apiAudience: '$OIDC_API_AUDIENCE',
            },
          };
          EOF
        working-directory: frontend
      - run: npm run build -- --configuration production
        working-directory: frontend

      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: frontend
          output_location: dist/frontend/browser
          skip_app_build: true
