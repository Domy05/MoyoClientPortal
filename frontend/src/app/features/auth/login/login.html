<div class="login-page">
  <div class="login-panel">
    <div class="brand-side">

      <img src="images/moyo-office.png" alt="Moyo office supplies" class="brand-image" />

      <div class="brand-overlay"></div>

      <div class="brand-header">
        <div class="brand-name">
          Moyo-Client Portal
        </div>
      </div>

      <div class="brand-copy">
        <h1>
          Essential supplies. For a more productive tomorrow.
        </h1>

        <p>
          Quality office and business supplies, delivered to your business.
        </p>
      </div>

    </div>

    <div class="form-side">
      
      <button type="button" class="back-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M19 12H5" />
          <path d="M12 19l-7-7 7-7" />
        </svg>

        <span>Back</span>
      </button>

      <div class="login-header">
        <h2>Welcome back</h2>
        <p class="subtitle">Sign in to your Moyo client portal</p>
      </div>

      <form [formGroup]="form" (ngSubmit)="submit()">

        <div class="input-group">

          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="3" y="5" width="18" height="14" rx="2" />

            <path d="m3 7 9 6 9-6" />
          </svg>

          <input type="email" formControlName="email" placeholder="Email address" />

        </div>

        <div class="input-group">

          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="4" y="10" width="16" height="10" rx="2" />

            <path d="M8 10V7a4 4 0 0 1 8 0v3" />
          </svg>

          <input type="password" formControlName="password" placeholder="Password" />

        </div>

        <div class="row-between">

          <label class="remember-me">

            <input type="checkbox" formControlName="rememberMe" />

            <span>Remember me</span>

          </label>

          <a href="#" class="forgot-link">
            Forgot password?
          </a>

        </div>

        <button type="submit" class="login-btn" [disabled]="form.invalid">
          Log In
        </button>

      </form>

      <p class="contact-line">
        Don't have an account?
        <a href="#">
          Contact your account manager.
        </a>
      </p>

    </div>

  </div>

</div>
