<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">
      <svg
        class="leaf-icon"
        viewBox="0 0 24 24"
        fill="white"
      >
        <path
          d="M12 2c-4 3-6 7-6 11a6 6 0 0 0 6 6c4 0 6-4 6-6 0-4-2-8-6-11z"
          opacity="0.9"
        />
      </svg>
      <div>
        <span class="brand-name">Moyo</span>
        <span class="brand-tagline">Client Portal</span>
      </div>
    </div>
    <nav>
      <a
        routerLink="/dashboard"
        routerLinkActive="active"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
        >
          <path d="M3 11l9-8 9 8" />
          <path d="M5 10v10h14V10" />
        </svg>
        Dashboard
      </a>
      <a
        routerLink="/products"
        routerLinkActive="active"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
        >
          <rect
            x="3"
            y="7"
            width="18"
            height="13"
            rx="2"
          />
          <path d="M8 7V5a4 4 0 0 1 8 0v2" />
        </svg>

        Products
      </a>
      <a
        routerLink="/cart"
        routerLinkActive="active"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
        >
          <circle cx="9" cy="20" r="1" />
          <circle cx="18" cy="20" r="1" />
          <path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.8a2 2 0 0 0 1.9-1.4L21 8H6" />
        </svg>
        Cart
      </a>
      <a
        routerLink="/orders"
        routerLinkActive="active"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
        >
          <rect
            x="4"
            y="6"
            width="16"
            height="15"
            rx="2"
          />
          <path d="M9 6V4h6v2" />
          <path d="M9 12h6" />
        </svg>
        Orders
      </a>
    </nav>
    <button
      class="logout"
      (click)="onAuthClick()"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
      >
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
        <path d="M16 17l5-5-5-5" />
        <path d="M21 12H9" />
      </svg>
      {{ authService.isLoggedIn() ? 'Log Out' : 'Log In' }}
    </button>
  </aside>

  <div class="main">
    <header class="topbar">
<div
  class="search-wrap"
  [class.search-disabled]="!searchEnabled"
>

  <svg
    class="search-icon"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="1.8"
  >
    <circle
      cx="11"
      cy="11"
      r="7"
    />
    <path d="m21 21-4.3-4.3" />
  </svg>

  <input
    type="text"
    [placeholder]="searchPlaceholder"
    class="search"
    [disabled]="!searchEnabled"
    (input)="onSearch($event)"
  />

</div>
<div class="user-menu">
  <span class="avatar">
    {{ initials }}
  </span>

  <span class="user-name">
    {{ fullName }}
  </span>
</div>
    </header>

    <main class="content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
